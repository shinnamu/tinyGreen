name: tinyGreen
options:
  bundleIdPrefix: fyi.shinnamu
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "15.0"

settings:
  base:
    # 빌드 산출물을 프로젝트 안에 고정 — DerivedData 에 두면 `mo clean` 이
    # 무인으로 쓸어가서 dogfood 인스턴스와 로그인 항목이 함께 증발한다 (2026-07-27).
    SYMROOT: "$(SRCROOT)/build/sym"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  tinyGreen:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - tinyGreen
    info:
      path: tinyGreen/Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: TinyGreen
        LSMinimumSystemVersion: "13.0"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "© 2026 도구 제작자 신나무로부터."
        NSInputMonitoringUsageDescription: "TinyGreen이 선택한 전환 키를 시스템 입력 소스 단축키에 연결하고 현재 상태를 표시합니다."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fyi.shinnamu.tinyGreen
        PRODUCT_NAME: tinyGreen
        MARKETING_VERSION: "2.1.1"
        CURRENT_PROJECT_VERSION: "19"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: "7G298A4T46"

  # 테스트 호스트 없음 (의도) — main.swift 가 실행 즉시 단일 인스턴스 가드 + hidutil
  # 매핑 적용 + 권한 프롬프트를 일으켜서, 앱을 host 로 붙이면 테스트가 시스템을 건드린다.
  # 대신 순수 로직 소스만 테스트 번들에 직접 컴파일 (같은 번들 = internal 접근, @testable 불필요).
  tinyGreenTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - tinyGreenTests
      - tinyGreen/remap.swift
      - tinyGreen/Indication/morse.swift
      - tinyGreen/Commons/settings.swift
      - tinyGreen/Commons/logger.swift
      - tinyGreen/Commons/notifications.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fyi.shinnamu.tinyGreenTests
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets:
        - tinyGreenTests
